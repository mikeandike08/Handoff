spring.application.name=handoff
springdoc.swagger-ui.show-common-extensions=true
springdoc.default-produces-media-type=application/json
app.cors.allowed-origin=http://localhost:5173
server.port=${HANDOFF_PORT:8080}
handoff.config-dir=${HANDOFF_CONFIG_DIR:${user.home}/.handoff}
handoff.download-dir=${HANDOFF_DOWNLOAD_DIR:${user.home}/Downloads/Handoff}
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
# Run requests on virtual threads, so offers waiting up to 60s for an answer don't tie up the server
spring.threads.virtual.enabled=true
